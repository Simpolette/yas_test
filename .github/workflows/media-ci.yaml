name: media service ci

on:
  push:
    branches: [ "main" ]
    paths:
      - "media/**"
      - ".github/workflows/actions/action.yaml"
      - ".github/workflows/media-ci.yaml"
      - "pom.xml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "media/**"
      - ".github/workflows/actions/action.yaml"
      - ".github/workflows/media-ci.yaml"
      - "pom.xml"
  workflow_dispatch:

env:
  FROM_ORIGINAL_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.ref == 'refs/heads/main' }}

jobs:
  Test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/workflows/actions
      - name: Run Tests
        run: mvn clean verify -pl media -am
      - name: Test Results
        uses: dorny/test-reporter@v1
        if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' && (success() || failure()) }}
        with:
          name: media-Service-Test-Results
          path: "media/**/*-reports/TEST*.xml"
          reporter: java-junit
          push: true
          tags: ghcr.io/nashtech-garage/yas-media:latest
      - name: Add coverage report to PR
        id: jacoco_reporter
        uses: madrapps/jacoco-report@v1.6.1
        if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' }}
        with:
          paths: ${{github.workspace}}/media/target/site/jacoco/jacoco.xml
          token: ${{secrets.GITHUB_TOKEN}}
          min-coverage-overall: 70
          min-coverage-changed-files: 70
          title: 'media Coverage Report'
          update-comment: true

      - name: Fail workflow if Coverage is low
        # Bước 2: Bắt kết quả của bước trên và đánh rớt pipeline nếu dưới 70
        run: |
          OVERALL=${{ steps.jacoco_reporter.outputs['coverage-overall'] }}
          echo "Current Overall Coverage is: $OVERALL%"
          
          # Dùng lệnh bc (máy tính) của Linux để so sánh số thập phân
          if (( $(echo "$OVERALL < 70.0" | bc -l) )); then
            echo "❌ LỖI: Độ phủ code ($OVERALL%) thấp hơn mức tối thiểu (70%)!"
            exit 1 # Lệnh này sẽ chính thức ĐÁNH ĐỎ pipeline của bạn
          else
            echo "✅ Độ phủ code đạt chuẩn!"
          fi
          
  Snyk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/maven@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif

      - name: Upload result to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
